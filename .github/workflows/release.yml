name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make check
      - run: ./scripts/release.sh "$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--generate-notes --verify-tag"
          case "$GITHUB_REF_NAME" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* $flags

  # The Android app, signed with the release key, attached to the same
  # release. Without the key in the repository's secrets, the release has no APK.
  android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and attach the APK
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.DEPLOYER_ANDROID_KEYSTORE_BASE64 }}
          DEPLOYER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DEPLOYER_ANDROID_KEYSTORE_PASSWORD }}
          DEPLOYER_ANDROID_KEY_ALIAS: ${{ secrets.DEPLOYER_ANDROID_KEY_ALIAS }}
          DEPLOYER_ANDROID_KEY_PASSWORD: ${{ secrets.DEPLOYER_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No Android signing key in the repository secrets; this release has no APK."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export DEPLOYER_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          (cd android && ./gradlew --no-daemon testDebugUnitTest assembleRelease -PdeployerVersion="$GITHUB_REF_NAME")
          apk="deployer-android_${GITHUB_REF_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release upload "$GITHUB_REF_NAME" "$apk"
